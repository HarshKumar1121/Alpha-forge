# Osmosis Allocator settings (docs/forge/OSMOSIS_ALLOCATOR.md).
# Starting values, tuned by hand once real output is in. Unknown keys are rejected.
# Fractions (cap, floor) are shares of the total points, not of PnL.

min_eligible: 10          # eligible Alphas a region+delay needs before a plan is made
max_selected: 10          # most Alphas one combination may hold
corr_cap: 0.7             # largest |daily PnL correlation| between two selected Alphas
min_sharpe_gain: 0.0      # extra Sharpe a candidate must add once the minimum size is reached

train_days: 504           # training window, trading days (~2 years)
test_days: 126            # out-of-sample window scored after each training window (~6 months)
step: 126                 # how far the windows roll forward between folds

cap: 0.25                 # largest share one Alpha may hold (25,000 of 100,000)
floor: 0.01               # smallest share a selected Alpha must hold (1,000 of 100,000)
total_points: 100000      # the points each scope must sum to exactly

bootstrap_samples: 2000   # resamples for the paired bootstrap that judges each method
bootstrap_block: 21       # mean stationary-bootstrap block length, days
mean_shrink: 0.5          # how far Max-Sharpe pulls each mean toward the group mean
seed: 7                   # fixed seed, so the same data gives the same verdict
periods_per_year: 252     # trading days per year, for annualising Sharpe
