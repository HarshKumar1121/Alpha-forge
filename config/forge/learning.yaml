# Learning engine settings.

surrogate:
  model: hist_gradient_boosting   # scikit-learn; lightgbm optional
  targets: [passes_gates, train_sharpe]
  min_training_rows: 500          # below this, rank by template stats only
  retrain: nightly
  exploration_share: 0.15         # always simulate a random slice the model would skip
  features: [template_id, template_category, complexity, operator_count, field_count,
             dataset_category, field_archetype, coverage, crowding, pyramid_multiplier,
             region, universe, delay, decay, neutralization, truncation]

template_evolution:
  population: 24
  generations_per_day: 1
  dataset_panel_size: 6           # test each mutant on 6 different datasets
  fitness: generalisation         # share of panel datasets where a variant passes train gates
  mutations: [swap_ts_operator, swap_window, add_group_wrapper, add_trade_when,
              add_smoothing, swap_rank_for_zscore, add_liquidity_tilt]
  max_operators: 12

lesson_mining:
  schedule: weekly
  min_support: 30                 # a pattern needs >= 30 alphas behind it to become a lesson

# Crowding score (forge/data/crowding.py): percentile rank of alphaCount and userCount within
# one scope, blended by these weights (normalised to sum to 1). 0 = least crowded, 1 = most.
crowding:
  alpha_count_weight: 0.5         # alphas already built on it: how mined the signal is
  user_count_weight: 0.5          # researchers who used it: how many people compete there

# Data Nugget crowding gate (forge/nuggets/field_search.py): same crowding score, two knobs
# on how it's used while building a nugget. Not thresholds for what a nugget *is* — only for
# the field-search filter and the dataset warning, so a caller can always override them.
nuggets:
  crowding_threshold: 0.7         # "low crowding only" filter default
  heavy_dataset_crowding: 0.75    # warn when adding a field from a dataset at least this crowded

families:
  pnl_corr_threshold: 0.6
  pool_collision: 0.7

montecarlo:
  bootstrap_block_days: 21
  bootstrap_samples: 2000
  permutation_samples: 500
