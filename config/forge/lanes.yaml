# Quota Governor — how 5,000 simulations a day are spent.
#
# Every simulation belongs to exactly one LANE. A lane has a share of the day, and min/max
# bounds for the learning allocator (Thompson sampling) to move within. Unused quota in a lane
# flows to the lanes that are producing — never past the daily limit.
# The ledger (table quota_ledger) records every simulation against its lane; the dashboard
# shows planned vs spent per lane, live.

daily_limit: 5000            # your BRAIN daily simulation limit (BRAIN's own figure wins if lower)
safety_margin: 150           # never plan into the last 150 (manual work, retries, surprises)
# The day itself is BRAIN's: it resets at midnight US Eastern, the same clock the header's
# "Simulation Quota Reset in" counts down to. It is not configurable because BRAIN decides it.
timezone: Asia/Kolkata       # YOUR clock: quiet hours and the Today screen's hourly chart use it
pacing:
  max_per_hour: 650          # spread the day; avoids bursts and keeps slots for manual work
  quiet_hours: []            # e.g. ["01:00-06:00"] if you want the machine idle overnight
allocation: fixed            # fixed for now; bandit (learn from each lane's yield) arrives in Phase 9
bandit:
  reward: new_family         # a sim's lane is rewarded when it yields a robust alpha that starts a NEW family
  prior: [1, 20]             # Beta(1, 20): expect ~5% success until evidence says otherwise
  rebalance: daily           # recompute shares each morning from the last 14 days
  window_days: 14

# Which lane pays for a simulation is read from the engine's task name:
#   "forge.<lane>"        -> that lane (how Forge pipelines name their work)
#   a name in task_lanes  -> the lane given there
#   anything else         -> default_lane (every existing lab screen and manual run)
default_lane: reserve
task_lanes: {}

lanes:
  explore:                   # field probes, dataset fingerprints, behaviour lab
    about: "Cheap probes that tell you how a field or dataset behaves before you build on it."
    share: 0.12
    bounds: [0.05, 0.20]
    alpha_types: [regular]
  forge_regular:             # template x field-set experiments, Regular
    about: "The main factory: templates crossed with field sets, looking for Regular alphas."
    share: 0.28
    bounds: [0.15, 0.45]
    alpha_types: [regular]
  power_pool:                # simple templates only (lint enforces <= 8 ops, <= 3 fields)
    about: "Deliberately simple alphas (few operators, few fields) aimed at the Power Pool."
    share: 0.15
    bounds: [0.08, 0.25]
    alpha_types: [power_pool, regular]
  atom:                      # single-dataset alphas
    about: "Alphas built from a single dataset, for the ATOM competition."
    share: 0.08
    bounds: [0.03, 0.15]
    alpha_types: [atom, regular]
  other_regions:             # EUR / ASI / GLB / region-agnostic
    about: "The same ideas outside the US: Europe, Asia, global and region-agnostic."
    share: 0.06
    bounds: [0.02, 0.12]
    alpha_types: [region_agnostic, regular]
  super_alpha:               # combinations of submitted alphas (slow, few)
    about: "Combinations of alphas you have already submitted; few and slow."
    share: 0.02
    bounds: [0.00, 0.05]
    alpha_types: [super_alpha]
  validate:                  # Hypothesis Court, robustness sweeps, repairs of strong candidates
    about: "Second opinions on strong candidates: robustness sweeps, the Court, repairs."
    share: 0.13
    bounds: [0.08, 0.20]
    alpha_types: [regular, power_pool, atom]
  template_research:         # evolving and testing NEW templates across datasets
    about: "Inventing and testing new templates across many datasets."
    share: 0.08
    bounds: [0.03, 0.15]
    alpha_types: [regular]
  reserve:                   # you, by hand, and agent proposals you approve in the UI
    about: "Yours: anything you run by hand from a lab screen, plus agent proposals you approve."
    share: 0.08
    bounds: [0.05, 0.10]
    alpha_types: [regular, power_pool, atom, arc]

# The router evaluates EVERY finished simulation against EVERY alpha type in
# config/forge/alpha_types, whatever lane paid for it. One sim, all tags.
